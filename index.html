<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console de Engenharia Acústica</title>
    <style>
        body { font-family: 'Consolas', monospace; background: #050505; color: #00ff00; text-align: center; padding: 10px; margin: 0; }
        .container { max-width: 900px; margin: auto; background: #111; padding: 20px; border-radius: 10px; border: 1px solid #00ff00; }
        h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
        canvas { width: 100%; height: 300px; background: #000; border: 1px solid #333; margin: 10px 0; }
        .panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: #1a1a1a; padding: 15px; border-radius: 8px; text-align: left; font-size: 0.8rem; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        input[type=range] { width: 100%; accent-color: #00ff00; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 15px 0; }
        button { padding: 12px; font-weight: bold; cursor: pointer; border: 1px solid #00ff00; background: transparent; color: #00ff00; text-transform: uppercase; }
        button:hover { background: #00ff00; color: #000; }
        button:disabled { border-color: #444; color: #444; cursor: not-allowed; }
        .status { font-size: 1.1rem; padding: 10px; border: 1px solid #333; margin-bottom: 10px; min-height: 1.5em; }
        label { display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="container">
    <h1>Acoustic Analyzer v5.0</h1>
    
    <div class="status" id="statusDisplay">SISTEMA PRONTO</div>

    <div class="panel">
        <div class="control-group">
            <label><span>Min Freq:</span> <span id="minVal">10000</span> Hz</label>
            <input type="range" id="minFreq" min="1000" max="22000" step="100" value="12000">
            
            <label><span>Max Freq:</span> <span id="maxVal">16000</span> Hz</label>
            <input type="range" id="maxFreq" min="2000" max="24000" step="100" value="16000">
        </div>
        <div class="control-group">
            <label><span>Varredura:</span> <span id="durVal">3.0</span>s</label>
            <input type="range" id="duration" min="0.5" max="10" step="0.5" value="3">

            <label><span>Resolução (FFT):</span> <span id="fftVal">8192</span></label>
            <input type="range" id="fftSize" min="11" max="14" step="1" value="13">
        </div>
    </div>

    <div class="btn-grid">
        <button id="emitBtn">Emitir</button>
        <button id="listenBtn">Ouvir</button>
        <button id="fullBtn">Full Duplex</button>
    </div>
    <button id="stopBtn" style="width: 100%; border-color: #ff0000; color: #ff0000;" disabled>STOP / RESET</button>

    <canvas id="visualizer"></canvas>
</div>

<script>
    let audioCtx, analyser, generator, micSource, animationId;
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const statusDisplay = document.getElementById('statusDisplay');

    // UI Updates
    const updateUI = () => {
        document.getElementById('minVal').innerText = document.getElementById('minFreq').value;
        document.getElementById('maxVal').innerText = document.getElementById('maxFreq').value;
        document.getElementById('durVal').innerText = document.getElementById('duration').value;
        document.getElementById('fftVal').innerText = Math.pow(2, document.getElementById('fftSize').value);
    };
    document.querySelectorAll('input').forEach(i => i.oninput = updateUI);
    updateUI();

    async function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        document.querySelectorAll('button').forEach(b => b.disabled = true);
        document.getElementById('stopBtn').disabled = false;
    }

    const startEmission = () => {
        const minF = parseFloat(document.getElementById('minFreq').value);
        const maxF = parseFloat(document.getElementById('maxFreq').value);
        const dur = parseFloat(document.getElementById('duration').value);

        generator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.5;
        generator.type = 'sine';
        generator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        generator.start();

        const loop = () => {
            if (!generator) return;
            const t = audioCtx.currentTime;
            generator.frequency.setValueAtTime(minF, t);
            generator.frequency.linearRampToValueAtTime(maxF, t + dur);
            setTimeout(loop, dur * 1000);
        };
        loop();
    };

    const startListening = async () => {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        micSource = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = Math.pow(2, document.getElementById('fftSize').value);
        micSource.connect(analyser);
        draw();
    };

    document.getElementById('emitBtn').onclick = async () => { await initAudio(); startEmission(); statusDisplay.innerText = "MODO: EMISSOR ATIVO"; };
    document.getElementById('listenBtn').onclick = async () => { await initAudio(); await startListening(); statusDisplay.innerText = "MODO: RECEPTOR ATIVO"; };
    document.getElementById('fullBtn').onclick = async () => { await initAudio(); startEmission(); await startListening(); statusDisplay.innerText = "MODO: FULL DUPLEX"; };
    document.getElementById('stopBtn').onclick = () => location.reload();

    function draw() {
        if (!analyser) return;
        animationId = requestAnimationFrame(draw);
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const sampleRate = audioCtx.sampleRate;
        const minF = parseFloat(document.getElementById('minFreq').value);
        const maxF = parseFloat(document.getElementById('maxFreq').value);

        const startBin = Math.floor(minF * analyser.fftSize / sampleRate);
        const endBin = Math.floor(maxF * analyser.fftSize / sampleRate);
        const visibleBins = endBin - startBin;
        const barWidth = canvas.width / visibleBins;

        // Grid e Legendas
        ctx.strokeStyle = '#222';
        ctx.fillStyle = '#555';
        ctx.font = '10px monospace';
        const step = (maxF - minF) / 5;
        for (let i = 0; i <= 5; i++) {
            const freq = minF + (step * i);
            const x = (i / 5) * canvas.width;
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            ctx.fillText(Math.round(freq) + "Hz", x + 2, canvas.height - 5);
        }

        let maxH = 0, peakF = 0;
        for (let i = 0; i < visibleBins; i++) {
            const binIndex = startBin + i;
            const barHeight = (dataArray[binIndex] / 255) * (canvas.height - 20);
            const x = (i / visibleBins) * canvas.width;

            if (dataArray[binIndex] > 180) {
                ctx.fillStyle = '#ff00ff';
                if (dataArray[binIndex] > maxH) { maxH = dataArray[binIndex]; peakF = (binIndex * sampleRate) / analyser.fftSize; }
            } else {
                ctx.fillStyle = '#00ff00';
            }
            ctx.fillRect(x, canvas.height - 20 - barHeight, barWidth + 1, barHeight);
        }

        if (maxH > 180) {
            statusDisplay.innerText = `RESSONÂNCIA EM: ${Math.round(peakF)} Hz`;
            statusDisplay.style.color = "#ff00ff";
        } else if (generator) {
            statusDisplay.innerText = `SCANNING: ${Math.round(generator.frequency.value)} Hz`;
            statusDisplay.style.color = "#00ff00";
        }
    }
</script>
</body>
</html>
